<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Train Times</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f0f0;
      color: #1a1a1a;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .header {
      background: #1e1464;
      padding: 10px 12px 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    #statusLabel {
      flex: 1;
      font-size: 13px;
      color: #fff;
      min-height: 18px;
    }

    .now-btn {
      background: #ffb300;
      color: #1e1464;
      border: none;
      padding: 6px 0;
      width: 72px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .now-btn:disabled { opacity: 0.55; cursor: default; }

    .time-input {
      width: 100%;
      padding: 8px 10px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      background: #fff;
      color: #1e1464;
      font-weight: 600;
    }

    /* ── Tabs ────────────────────────────────────────────────── */
    .tabs {
      display: flex;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }

    .tab-btn {
      flex: 1;
      padding: 11px 8px;
      border: none;
      background: transparent;
      font-size: 15px;
      cursor: pointer;
      color: #777;
      border-bottom: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab-btn.active {
      color: #1e1464;
      border-bottom-color: #ffb300;
      font-weight: 700;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Journey list ────────────────────────────────────────── */
    .refresh-bar {
      display: flex;
      justify-content: flex-end;
      padding: 7px 12px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid #1e1464;
      color: #1e1464;
      padding: 4px 13px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    .refresh-btn:hover { background: #f0f0ff; }

    .journey-list { list-style: none; background: #fff; }

    .journey-item {
      padding: 13px 16px;
      border-bottom: 1px solid #f0f0f0;
    }

    .journey-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #111;
    }

    .journey-subtitle {
      font-size: 13px;
      color: #555;
    }

    .status-ok   { color: #2e7d32; }
    .status-late { color: #c62828; }

    .empty-msg {
      padding: 22px 16px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <span id="statusLabel"></span>
    <button class="now-btn" id="nowBtn" onclick="onNow()">Now</button>
  </div>
  <input type="time" class="time-input" id="timeInput">
</div>

<div class="tabs">
  <button class="tab-btn active" id="tab-work" onclick="switchTab('work')">Work</button>
  <button class="tab-btn"        id="tab-home" onclick="switchTab('home')">Home</button>
</div>

<div class="refresh-bar">
  <button class="refresh-btn" onclick="doRefresh()">&#8635; Refresh</button>
</div>

<div id="panel-work" class="tab-panel active">
  <ul class="journey-list" id="list-work"></ul>
</div>
<div id="panel-home" class="tab-panel">
  <ul class="journey-list" id="list-home"></ul>
</div>

<script>
  const WORKER_URL = "https://nr-proxy.airmail.lol";
  const JP_URL = `${WORKER_URL}/journey-planner`;
  const CP_URL = `${WORKER_URL}/calling-points`;
  const HEADERS = {
    "Accept": "application/json",
    "Content-Type": "application/json",
    "X-JP-Platform": "web",
  };
  const ROUTES = [
    { origin: "WSU", dest: "CTK", tab: "work" },
    { origin: "CTK", dest: "WSU", tab: "home" },
  ];
  const MAX_JOURNEYS = 8;

  function fmtTime(iso) { return iso ? iso.slice(11, 16) : null; }

  function routeLabel(stops) {
    const crs = new Set(stops.map(s => s.crsCode));
    if (crs.has("WIM")) return "via Wimbledon";
    if (crs.has("HCB")) return "via Hackbridge";
    return "";
  }

  async function fetchJourneys(origin, destination, departAt) {
    // Format as local ISO with the actual UTC offset (GMT/BST aware)
    const pad = n => String(n).padStart(2, "0");
    const off = -departAt.getTimezoneOffset();
    const tz = `${off >= 0 ? "+" : "-"}${pad(Math.floor(Math.abs(off) / 60))}:${pad(Math.abs(off) % 60)}`;
    const ts = `${departAt.getFullYear()}-${pad(departAt.getMonth()+1)}-${pad(departAt.getDate())}` +
               `T${pad(departAt.getHours())}:${pad(departAt.getMinutes())}:00${tz}`;
    const body = {
      origin:      { crs: origin,      group: false },
      destination: { crs: destination, group: false },
      outwardTime: { travelTime: ts, type: "DEPART" },
      fareRequestDetails: { passengers: { adult: 1, child: 0 }, fareClass: "ANY", railcards: [] },
      directTrains: false,
      reducedTransferTime: false,
      onlySearchForSleeper: false,
      overtakenTrains: true,
      useAlternativeServices: false,
      increasedInterchange: "ZERO",
    };
    const resp = await fetch(JP_URL, { method: "POST", headers: HEADERS, body: JSON.stringify(body) });
    if (!resp.ok) throw new Error(`Journey planner returned HTTP ${resp.status}`);
    return (await resp.json()).outwardJourneys || [];
  }

  async function fetchCallingPoints(origin, destination, j) {
    const sched = j.timetable.scheduled;
    const body = { origin, destination, depart: sched.departure, arrive: sched.arrival };
    const resp = await fetch(CP_URL, { method: "POST", headers: HEADERS, body: JSON.stringify(body) });
    if (!resp.ok) return [];
    const legs = (await resp.json()).legs || [];
    const stops = [], seen = new Set();
    for (const leg of legs) {
      for (const cp of (leg.realtimeCallingPoints || [])) {
        if (!seen.has(cp.crsCode)) { seen.add(cp.crsCode); stops.push(cp); }
      }
    }
    return stops;
  }

  function makeCard(card) {
    const li = document.createElement("li");
    li.className = "journey-item";

    const title = document.createElement("div");
    title.className = "journey-title";
    title.textContent = `${card.dep} → ${card.arr}`;

    const sub = document.createElement("div");
    sub.className = "journey-subtitle";
    const parts = [card.duration];
    if (card.via) parts.push(card.via);

    let statusText = card.status || "";
    if (card.exp_dep) statusText += ` (exp ${card.exp_dep})`;
    parts.push(statusText);
    sub.textContent = parts.join(" · ");

    const s = (card.status || "").toUpperCase();
    if (s === "ON_TIME" || s === "STARTS HERE") sub.classList.add("status-ok");
    else if (s.includes("DELAY") || s.includes("CANCEL")) sub.classList.add("status-late");

    li.append(title, sub);
    return li;
  }

  function setList(tabId, html) {
    const ul = document.getElementById(`list-${tabId}`);
    if (typeof html === "string") { ul.innerHTML = html; } else {
      ul.innerHTML = "";
      html.forEach(el => ul.appendChild(el));
    }
  }

  async function doRefresh() {
    const val = document.getElementById("timeInput").value;
    if (!val) return;
    const [h, m] = val.split(":").map(Number);
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);

    if (start < new Date(now.getTime() - 60_000)) {
      ROUTES.forEach(r => setList(r.tab, `<li class="empty-msg">Cannot query past times. Please select a future time.</li>`));
      document.getElementById("statusLabel").textContent = "";
      return;
    }

    document.getElementById("nowBtn").disabled = true;
    document.getElementById("statusLabel").textContent = "Loading…";

    try {
      await Promise.all(ROUTES.map(async ({ origin, dest, tab }) => {
        const journeys = await fetchJourneys(origin, dest, start);
        const filtered = journeys
          .filter(j => j.timetable?.scheduled?.departure && new Date(j.timetable.scheduled.departure) >= start)
          .slice(0, MAX_JOURNEYS);

        const cards = await Promise.all(filtered.map(async j => {
          let stops = [];
          try { stops = await fetchCallingPoints(origin, dest, j); } catch {}
          const sched = j.timetable.scheduled;
          const rt    = j.timetable.realtime || {};
          const schedDep = fmtTime(sched.departure) || "?";
          const schedArr = fmtTime(sched.arrival)   || "?";
          const realDep  = fmtTime(rt.departure);
          const realArr  = fmtTime(rt.arrival);
          return {
            dep:     schedDep,
            arr:     schedArr,
            exp_dep: realDep && realDep !== schedDep ? realDep : null,
            exp_arr: realArr && realArr !== schedArr ? realArr : null,
            duration: j.duration,
            via:      routeLabel(stops),
            status:   j.status,
          };
        }));

        if (cards.length === 0) {
          setList(tab, `<li class="empty-msg">No upcoming journeys found.</li>`);
        } else {
          setList(tab, cards.map(makeCard));
        }
      }));
      document.getElementById("statusLabel").textContent = "";
    } catch (e) {
      ROUTES.forEach(r => setList(r.tab, `<li class="empty-msg">Error: ${e.message}</li>`));
      document.getElementById("statusLabel").textContent = "Error";
    } finally {
      document.getElementById("nowBtn").disabled = false;
    }
  }

  function onNow() {
    const now = new Date();
    document.getElementById("timeInput").value =
      `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
    doRefresh();
  }

  function switchTab(id) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    document.getElementById(`tab-${id}`).classList.add("active");
    document.getElementById(`panel-${id}`).classList.add("active");
  }

  // Boot
  onNow();
  document.getElementById("timeInput").addEventListener("change", doRefresh);
</script>
</body>
</html>
